#################################################################
# P6Spy Options File                                            #
# See documentation for detailed instructions                   #
# https://p6spy.readthedocs.io/en/latest/configandusage.html   #
#################################################################

# Модуль для перехвата JDBC вызовов
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory

# Класс драйвера PostgreSQL (реальный драйвер под обёрткой)
driverlist=org.postgresql.Driver

# Формат вывода логов (SingleLineFormat - однострочный, удобный для чтения)
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime) | SQL: %(sqlSingleLine) | Время выполнения: %(executionTime) ms

# Куда писать логи: slf4j (интеграция с Log4j2), stdout, файл
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# Логировать ли пустые результаты (полезно для дебага)
excludecategories=info,debug,result,resultset

# Логировать параметры запросов (включая значения)
# Формат: вместо ? подставляются реальные значения
# autoflush - сразу записывать в лог (полезно при падении теста)
autoflush=true

# Фильтр по паттернам SQL (пустое = логировать всё)
# Можно исключить системные запросы типа SELECT 1
#filter=false
#sqlexpression=

# Показывать стек трейс для каждого SQL (полезно для поиска источника запроса)
# Внимание: сильно увеличивает объём логов
stacktrace=false
stacktraceclass=

# Логировать только длинные запросы (в миллисекундах)
# 0 = логировать всё
executionThreshold=0

# Дата-время формат
dateformat=yyyy-MM-dd HH:mm:ss.SSS

# Логировать batch операции
logbatch=true
