#################################################################
# P6Spy Options File                                            #
# See documentation for detailed instructions                   #
# https://p6spy.readthedocs.io/en/latest/configandusage.html   #
#################################################################

# Module for intercepting JDBC calls
modulelist=com.p6spy.engine.spy.P6SpyFactory,com.p6spy.engine.logging.P6LogFactory

# Real PostgreSQL driver (wrapped by P6Spy)
driverlist=org.postgresql.Driver

# Log output format (SingleLineFormat - single line, easy to read)
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime) | SQL: %(sqlSingleLine) | Execution time: %(executionTime) ms

# Where to write logs: slf4j (integrates with Log4j2), stdout, or file
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# Exclude empty results from logs (useful for debugging)
excludecategories=info,debug,result,resultset

# Log query parameters (including actual values)
# Format: substitutes ? with real values
# autoflush - write to log immediately (useful when test crashes)
autoflush=true

# Filter SQL by patterns (empty = log everything)
# Can exclude system queries like SELECT 1
#filter=false
#sqlexpression=

# Show stack trace for each SQL (useful for finding query source)
# Warning: significantly increases log volume
stacktrace=false
stacktraceclass=

# Log only slow queries (in milliseconds)
# 0 = log everything
executionThreshold=0

# Date-time format
dateformat=yyyy-MM-dd HH:mm:ss.SSS

# Log batch operations
logbatch=true
